<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Ada Świderska, aktorka z Warszawy. Portfolio aktorskie, zdjęcia i kontakt."
    >

    <title>Ada Świderska | Aktorka</title>

    <style>
        :root {
            --background: #0d0c0e;
            --background-secondary: #171419;
            --text: #f4f0ec;
            --text-muted: #b8afb4;
            --accent: #7b2948;
            --border: rgba(255, 255, 255, 0.14);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
        }

        body.modal-open {
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            display: block;
            width: 100%;
        }

        /* NAWIGACJA */

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            padding: 22px 6%;
            transition: background 0.3s ease;
        }

        .navbar.scrolled {
            background: rgba(13, 12, 14, 0.94);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: opacity 0.2s ease;
        }

        .nav-links a:hover {
            opacity: 0.65;
        }

        .menu-button {
            display: none;
            color: white;
            background: transparent;
            border: 0;
            font-size: 26px;
            cursor: pointer;
        }
